<!doctype html>
<html lang="en">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Sleep Outside | Home</title>
  <link rel="stylesheet" href="css/style.css" />
</head>

<body>
  <header class="divider" id="main-header"></header>
  <main class="divider">
    <div class="hero">
      <img src="images/banner-sm.jpg" srcset="images/banner-sm.jpg 500w, images/banner.jpg"
        alt="image of a high mountain lake" />
      <div class="logo logo--square">
        <img src="images/noun_Tent_2517.svg" alt="tent image for logo" />
        <div>Sleep<span class="highlight">Outside</span></div>
      </div>
      <div class="mission">
        <p>
          Our mission is to provide you with everything you need to sleep
          outside comfortably at an affordable price.
        </p>
      </div>
    </div>

    <section class="products">
      <h2>Top Products</h2>
      <ul class="product-list category-list">
        <li class="category-card">
          <a href="product_listing/index.html?category=tents">Tents</a>
        </li>
        <li class="category-card">
          <a href="product_listing/index.html?category=backpacks">Backpacks</a>
        </li>
        <li class="category-card">
          <a href="product_listing/index.html?category=sleeping-bags">Sleeping Bags</a>
        </li>
        <li class="category-card">
          <a href="product_listing/index.html?category=hammocks">Hammocks</a>
        </li>
      </ul>
    </section>

    <section class="newsletter">
      <h2>Subscribe to our Newsletter</h2>
      <p>Get updates about new products, deals, and outdoor tips.</p>

      <form class="newsletter-form" id="newsletter-form" novalidate>
        <label for="newsletter-email" class="sr-only">Email address</label>
        <input type="email" id="newsletter-email" name="newsletter-email" placeholder="Enter your email"
          aria-describedby="newsletter-message" required />
        <button type="submit">Subscribe</button>
      </form>

      <p id="newsletter-message" class="newsletter-message" aria-live="polite"></p>
    </section>
  </main>
  <footer id="main-footer"></footer>
  <script type="module" src="js/main.js"></script>
</body>

</html>
